<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>NYC 2026 — Viaje Familiar</title>
<meta name="theme-color" content="#0B0B1F" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NYC Trip" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Chakra+Petch:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Monoton&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0B0B1F; --bg2:#12122A; --card:#1B1B3A; --card-hi:#232349;
  --chrome-hi:#E8ECF5; --chrome-lo:#6F7A94;
  --text-hi:#F5F3FF; --text-mid:#ABA6D6; --text-dim:#726D9C;
  --magenta:#FF3EA5; --cyan:#29F1E0; --yellow:#FCEE3B; --violet:#9B5CFF;
  --mint:#4CFFB3; --orange:#FF7A3D;
  --line:rgba(255,255,255,.09);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text-hi);
  font-family:'Chakra Petch', ui-sans-serif, system-ui, sans-serif;
  min-height:100vh; min-height:100dvh;
  overflow-x:hidden;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0px, rgba(255,255,255,.025) 1px, transparent 1px, transparent 3px);
}
h1,h2,h3,.display{font-family:'Audiowide', ui-sans-serif, sans-serif; letter-spacing:.02em;}
.mono-num{font-variant-numeric:tabular-nums;}
a{color:var(--cyan);}
button{font-family:inherit;}
::selection{background:var(--magenta); color:#0B0B1F;}

/* ---------- layout shell ---------- */
#app{display:flex; flex-direction:column; min-height:100vh; min-height:100dvh;}
header.topbar{
  position:sticky; top:0; z-index:40;
  padding:calc(10px + var(--safe-t)) 14px 10px;
  background:linear-gradient(180deg, #14142C 0%, #0F0F26 100%);
  border-bottom:2px solid var(--line);
  display:flex; align-items:center; gap:10px;
  box-shadow:0 4px 18px rgba(0,0,0,.4);
}
.logo{
  font-family:'Monoton', cursive; font-size:15px; line-height:1;
  color:var(--magenta); text-shadow:0 0 8px var(--magenta), 0 0 18px rgba(255,62,165,.5);
  white-space:nowrap;
}
.trip-sub{font-size:10px; color:var(--text-mid); letter-spacing:.08em; text-transform:uppercase; margin-top:2px;}
.topbar-spacer{flex:1;}
.icon-btn{
  width:38px;height:38px;border-radius:50%; border:1.5px solid var(--line);
  background:var(--card); color:var(--text-hi); display:flex; align-items:center; justify-content:center;
  font-size:17px; cursor:pointer; position:relative;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 2px 6px rgba(0,0,0,.35);
}
.icon-btn:active{transform:scale(.93);}
.badge-dot{
  position:absolute; top:-2px; right:-2px; width:9px;height:9px;border-radius:50%;
  background:var(--magenta); border:1.5px solid var(--bg2); display:none;
}
.badge-dot.show{display:block;}
.identity-chip{
  display:flex; align-items:center; gap:6px; padding:5px 10px 5px 5px; border-radius:999px;
  background:var(--card); border:1.5px solid var(--line); cursor:pointer; font-size:12px; color:var(--text-hi);
}
.identity-dot{width:20px;height:20px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-size:10px; font-weight:700; color:#0B0B1F;}

main{flex:1; position:relative; padding-bottom:calc(78px + var(--safe-b));}
.view{display:none; animation:fadein .25s ease;}
.view.active{display:block;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

/* ---------- bottom nav ---------- */
nav.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  display:flex; padding:8px 10px calc(8px + var(--safe-b));
  background:linear-gradient(0deg, #14142C 0%, #0F0F26 100%);
  border-top:2px solid var(--line);
  box-shadow:0 -6px 20px rgba(0,0,0,.45);
}
.tab-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none; border:none; color:var(--text-dim); font-size:10px; letter-spacing:.05em;
  padding:6px 2px; border-radius:12px; cursor:pointer; text-transform:uppercase;
}
.tab-btn .ic{font-size:19px; filter:grayscale(1) brightness(1.4);}
.tab-btn.active{color:var(--text-hi); background:rgba(255,255,255,.05);}
.tab-btn.active .ic{filter:none;}

/* ---------- identity overlay ---------- */
#identity-overlay{
  position:fixed; inset:0; z-index:200; background:rgba(6,6,16,.9); backdrop-filter:blur(6px);
  display:flex; align-items:center; justify-content:center; padding:24px;
}
#identity-overlay.hidden{display:none;}
.identity-card{
  width:100%; max-width:360px; background:var(--card); border:2px solid var(--line); border-radius:20px;
  padding:26px 22px; box-shadow:0 0 40px rgba(255,62,165,.15), 0 20px 50px rgba(0,0,0,.5);
}
.identity-card h2{margin:0 0 4px; font-size:20px; color:var(--cyan); text-shadow:0 0 10px rgba(41,241,224,.4);}
.identity-card p{margin:0 0 18px; font-size:12px; color:var(--text-mid);}
.member-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.member-btn{
  display:flex; align-items:center; gap:9px; padding:11px 12px; border-radius:14px;
  background:var(--bg2); border:1.5px solid var(--line); color:var(--text-hi); font-size:14px; cursor:pointer;
  font-family:'Chakra Petch'; font-weight:600;
}
.member-btn:active{transform:scale(.96);}
.member-swatch{width:22px;height:22px;border-radius:50%; flex-shrink:0; box-shadow:inset 0 1px 2px rgba(255,255,255,.4), inset 0 -1px 3px rgba(0,0,0,.3);}

/* ---------- ios banner ---------- */
#ios-banner{
  display:none; margin:10px 14px 0; padding:12px 14px; border-radius:14px;
  background:linear-gradient(135deg, rgba(255,62,165,.15), rgba(41,241,224,.1));
  border:1.5px solid var(--magenta); font-size:12px; color:var(--text-hi); position:relative;
}
#ios-banner.show{display:block;}
#ios-banner button.dismiss{
  position:absolute; top:6px; right:8px; background:none; border:none; color:var(--text-mid); font-size:16px; cursor:pointer;
}

/* ---------- days view ---------- */
#view-days{padding:14px 12px 24px;}
.day-section{margin-bottom:22px;}
.day-head{
  display:flex; align-items:baseline; gap:8px; margin:0 4px 10px; padding-bottom:6px;
  border-bottom:2px dashed var(--line);
}
.day-head .d-name{font-family:'Audiowide'; font-size:15px; color:var(--yellow); text-shadow:0 0 10px rgba(252,238,59,.35);}
.day-head .d-zone{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em;}
.poi-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px;}

.poi-card{
  position:relative; overflow:hidden;
  background:linear-gradient(160deg, var(--card-hi), var(--card));
  border:1.5px solid var(--line); border-radius:14px; padding:11px 12px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06), inset 0 -12px 20px -14px rgba(0,0,0,.6), 0 3px 10px rgba(0,0,0,.3);
  display:flex; gap:10px; align-items:flex-start;
}
.poi-card.dragging{opacity:.5; border-color:var(--cyan);}
.drag-handle{
  touch-action:none; color:var(--text-dim); font-size:16px; padding:4px 2px 4px 0; cursor:grab; line-height:1; margin-top:2px;
}
.pin-badge{
  width:34px;height:34px;border-radius:50%; flex-shrink:0; display:flex;align-items:center;justify-content:center;
  font-size:16px; border:2px solid rgba(255,255,255,.7);
  box-shadow: inset 0 2px 3px rgba(255,255,255,.5), inset 0 -2px 4px rgba(0,0,0,.35), 0 0 10px var(--glow);
}
.poi-body{flex:1; min-width:0;}
.poi-top{display:flex; justify-content:space-between; align-items:flex-start; gap:6px;}
.poi-name{font-weight:700; font-size:14.5px; line-height:1.25;}
.poi-meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:5px;}
.chip{
  font-size:10px; padding:3px 8px; border-radius:999px; background:rgba(255,255,255,.06);
  border:1px solid var(--line); color:var(--text-mid); white-space:nowrap;
}
.chip.cost{color:var(--mint); border-color:rgba(76,255,179,.3);}
.chip.added{color:var(--violet); border-color:rgba(155,92,255,.3);}
.poi-note{
  margin-top:7px; font-size:12px; color:var(--text-mid); background:transparent; border:none; border-bottom:1px dashed var(--line);
  width:100%; padding:3px 0; font-family:inherit; resize:none;
}
.poi-note:focus{outline:none; border-color:var(--cyan);}
.transport-row{margin-top:7px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
.transport-row input{
  background:var(--bg2); border:1px solid var(--line); border-radius:8px; color:var(--text-hi);
  font-size:11px; padding:4px 7px; font-family:inherit; width:96px;
}
.transport-label{font-size:10px; color:var(--text-dim); text-transform:uppercase;}
.poi-actions{display:flex; flex-direction:column; gap:6px; align-items:center;}
.done-btn{
  width:32px;height:32px;border-radius:50%; border:1.5px solid var(--line); background:var(--bg2);
  color:var(--text-dim); font-size:15px; cursor:pointer; display:flex;align-items:center;justify-content:center;
}
.done-btn.on{background:var(--mint); color:#062018; border-color:var(--mint); box-shadow:0 0 10px rgba(76,255,179,.5);}
.del-btn{background:none; border:none; color:var(--text-dim); font-size:13px; cursor:pointer;}

.poi-card.is-done{opacity:.72;}
.poi-card.is-done .poi-name{text-decoration:line-through; text-decoration-color:var(--mint);}
.poi-card.is-done::after{
  content:'VISITADO'; position:absolute; top:10px; right:-30px; width:130px; text-align:center;
  transform:rotate(28deg); font-family:'Audiowide'; font-size:10px; letter-spacing:.12em;
  color:var(--mint); border-top:2px solid var(--mint); border-bottom:2px solid var(--mint);
  padding:2px 0; opacity:.8; pointer-events:none;
}

/* ---------- map view ---------- */
#view-map{padding:0;}
#leaflet-map{width:100%; height:calc(100dvh - 130px - var(--safe-t)); background:#0c0c1e;}
.leaflet-tile-pane{filter:brightness(.62) saturate(1.35) hue-rotate(180deg) contrast(1.08);}
.filter-bar{
  display:flex; gap:7px; overflow-x:auto; padding:10px 12px; -webkit-overflow-scrolling:touch;
  background:var(--bg2); border-bottom:1.5px solid var(--line);
}
.filter-bar::-webkit-scrollbar{display:none;}
.filter-chip{
  flex-shrink:0; padding:6px 12px; border-radius:999px; background:var(--card); border:1.5px solid var(--line);
  color:var(--text-mid); font-size:11px; white-space:nowrap; cursor:pointer; font-weight:600;
}
.filter-chip.active{background:var(--magenta); color:#0B0B1F; border-color:var(--magenta);}
.pin{
  width:32px;height:32px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-size:15px;
  border:2px solid rgba(255,255,255,.75);
  box-shadow: inset 0 2px 3px rgba(255,255,255,.5), inset 0 -2px 4px rgba(0,0,0,.35), 0 0 9px var(--glow);
}
.pin.done{opacity:.45;}
.leaflet-popup-content-wrapper{background:var(--card); color:var(--text-hi); border-radius:14px; border:1.5px solid var(--line);}
.leaflet-popup-tip{background:var(--card);}
.leaflet-popup-content{margin:12px 14px; font-family:'Chakra Petch';}
.popup-title{font-weight:700; font-size:14px; margin-bottom:4px;}
.popup-meta{font-size:11px; color:var(--text-mid); margin-bottom:8px;}
.popup-done{
  font-size:11px; padding:5px 10px; border-radius:8px; border:1.5px solid var(--mint); color:var(--mint); background:none; cursor:pointer; font-weight:700;
}
.popup-done.on{background:var(--mint); color:#062018;}

/* ---------- budget view ---------- */
#view-budget{padding:16px 14px 24px;}
.budget-hero{
  display:flex; gap:10px; margin-bottom:16px;
}
.budget-tile{
  flex:1; background:linear-gradient(160deg, var(--card-hi), var(--card)); border:1.5px solid var(--line); border-radius:16px;
  padding:14px; text-align:center;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 4px 12px rgba(0,0,0,.3);
}
.budget-tile .label{font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em;}
.budget-tile .value{font-family:'Audiowide'; font-size:24px; margin-top:6px; color:var(--yellow); text-shadow:0 0 10px rgba(252,238,59,.3);}
.budget-tile.alt .value{color:var(--cyan); text-shadow:0 0 10px rgba(41,241,224,.3);}
.section-title{font-family:'Audiowide'; font-size:13px; color:var(--text-mid); margin:20px 4px 10px; text-transform:uppercase; letter-spacing:.06em;}
.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
.bar-label{width:78px; font-size:11px; color:var(--text-mid); flex-shrink:0;}
.bar-track{flex:1; height:14px; background:var(--bg2); border-radius:8px; overflow:hidden; border:1px solid var(--line);}
.bar-fill{height:100%; border-radius:8px;}
.bar-val{width:52px; text-align:right; font-size:11px; color:var(--text-hi); flex-shrink:0;}
.split-bar{display:flex; height:22px; border-radius:10px; overflow:hidden; border:1.5px solid var(--line); margin-bottom:6px;}
.split-bar div{display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:#0B0B1F;}
.transport-note{
  margin-top:18px; padding:12px 14px; border-radius:14px; background:rgba(255,122,61,.08); border:1.5px solid rgba(255,122,61,.3);
  font-size:12px; color:var(--text-mid);
}

/* ---------- fab + modal ---------- */
.fab{
  position:fixed; right:16px; bottom:calc(90px + var(--safe-b)); z-index:45;
  width:56px;height:56px;border-radius:50%; border:2px solid rgba(255,255,255,.4);
  background:radial-gradient(circle at 35% 30%, #FF6FC3, var(--magenta) 60%, #B8207A);
  color:#fff; font-size:26px; display:flex;align-items:center;justify-content:center; cursor:pointer;
  box-shadow:0 0 22px rgba(255,62,165,.55), 0 6px 16px rgba(0,0,0,.4);
}
.fab:active{transform:scale(.92);}
.sheet-overlay{
  position:fixed; inset:0; z-index:150; background:rgba(6,6,16,.75); backdrop-filter:blur(3px);
  display:flex; align-items:flex-end; justify-content:center;
}
.sheet-overlay.hidden{display:none;}
.sheet{
  width:100%; max-width:480px; max-height:88vh; overflow-y:auto; background:var(--bg2);
  border-radius:22px 22px 0 0; border:2px solid var(--line); border-bottom:none;
  padding:18px 18px calc(24px + var(--safe-b));
}
.sheet h3{margin:0 0 14px; font-size:16px; color:var(--cyan);}
.field{margin-bottom:12px;}
.field label{display:block; font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; margin-bottom:5px;}
.field input, .field select, .field textarea{
  width:100%; background:var(--card); border:1.5px solid var(--line); border-radius:10px; color:var(--text-hi);
  padding:10px 11px; font-size:14px; font-family:inherit;
}
.field textarea{resize:vertical; min-height:56px;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
#mini-map{height:160px; border-radius:12px; margin-top:6px; border:1.5px solid var(--line);}
.mini-map-hint{font-size:10px; color:var(--text-dim); margin-top:5px;}
.btn-primary{
  width:100%; padding:13px; border-radius:12px; border:none; margin-top:6px;
  background:linear-gradient(135deg, var(--cyan), #17B8AC); color:#062018; font-weight:700; font-size:14px;
  font-family:'Audiowide'; letter-spacing:.03em; cursor:pointer;
}
.btn-ghost{
  width:100%; padding:10px; border-radius:12px; margin-top:8px; background:none; border:1.5px solid var(--line);
  color:var(--text-mid); font-size:12px; cursor:pointer;
}

/* ---------- activity panel ---------- */
#activity-panel{
  position:fixed; top:0; right:0; bottom:0; width:min(340px,86vw); z-index:180;
  background:var(--bg2); border-left:2px solid var(--line); transform:translateX(100%);
  transition:transform .25s ease; padding:calc(16px + var(--safe-t)) 16px 16px; overflow-y:auto;
}
#activity-panel.open{transform:translateX(0);}
#activity-panel h3{color:var(--yellow); font-size:15px; margin:0 0 14px;}
.activity-item{padding:9px 0; border-bottom:1px solid var(--line); font-size:12.5px; color:var(--text-mid);}
.activity-item b{color:var(--text-hi);}
.activity-time{font-size:10px; color:var(--text-dim); margin-top:2px;}
#activity-scrim{position:fixed; inset:0; z-index:170; background:rgba(0,0,0,.5); display:none;}
#activity-scrim.show{display:block;}

::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--card-hi); border-radius:4px;}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div>
      <div class="logo">NYC◦2026</div>
      <div class="trip-sub" id="countdown-text">16–23 sep</div>
    </div>
    <div class="topbar-spacer"></div>
    <button class="icon-btn" id="btn-bell" title="Notificaciones">🔔<span class="badge-dot" id="bell-dot"></span></button>
    <button class="icon-btn" id="btn-activity" title="Actividad">📜</button>
    <button class="identity-chip" id="identity-chip"><span class="identity-dot" id="identity-dot">?</span><span id="identity-name">Tú</span></button>
  </header>

  <div id="ios-banner">
    📲 Para recibir notificaciones en iPhone: toca <b>Compartir</b> → <b>Agregar a inicio</b>, y abre la app desde ahí.
    <button class="dismiss" id="ios-dismiss">✕</button>
  </div>

  <main>
    <section id="view-map" class="view">
      <div class="filter-bar" id="filter-days"></div>
      <div class="filter-bar" id="filter-kind">
        <button class="filter-chip active" data-kind="all">Todos</button>
        <button class="filter-chip" data-kind="tour">🗼 Turismo</button>
        <button class="filter-chip" data-kind="food">🍽️ Comida</button>
      </div>
      <div id="leaflet-map"></div>
    </section>

    <section id="view-days" class="view active"></section>

    <section id="view-budget" class="view"></section>
  </main>

  <button class="fab" id="btn-fab">+</button>

  <nav class="tabbar">
    <button class="tab-btn" data-view="view-map"><span class="ic">🗺️</span>Mapa</button>
    <button class="tab-btn active" data-view="view-days"><span class="ic">📅</span>Días</button>
    <button class="tab-btn" data-view="view-budget"><span class="ic">💰</span>Presupuesto</button>
  </nav>

  <div id="identity-overlay">
    <div class="identity-card">
      <h2>¿Quién eres? 👋</h2>
      <p>Así sabemos quién agregó o marcó cada punto. Se guarda en este dispositivo.</p>
      <div class="member-grid" id="member-grid"></div>
    </div>
  </div>

  <div id="activity-scrim"></div>
  <div id="activity-panel">
    <h3>📜 Actividad reciente</h3>
    <div id="activity-list"></div>
  </div>

  <div class="sheet-overlay hidden" id="add-overlay">
    <div class="sheet">
      <h3>✨ Agregar punto de interés</h3>
      <form id="add-form">
        <div class="field">
          <label>Nombre</label>
          <input type="text" id="f-name" required placeholder="Ej. Levain Bakery" />
        </div>
        <div class="two-col">
          <div class="field">
            <label>Día</label>
            <select id="f-day"></select>
          </div>
          <div class="field">
            <label>Categoría</label>
            <select id="f-category">
              <optgroup label="Turismo">
                <option value="landmark">🗼 Ícono / Monumento</option>
                <option value="museum">🖼️ Museo</option>
                <option value="park">🌳 Parque</option>
                <option value="shopping">🛍️ Shopping</option>
                <option value="show">🎟️ Show / Evento</option>
                <option value="transit">⛴️ Transporte / Ferry</option>
              </optgroup>
              <optgroup label="Comida">
                <option value="restaurant">🍽️ Restaurante</option>
                <option value="bakery">🧁 Bakery / Postre</option>
                <option value="streetfood">🥡 Callejera / Casual</option>
              </optgroup>
            </select>
          </div>
        </div>
        <div class="two-col">
          <div class="field">
            <label>Costo (USD, opcional)</label>
            <input type="number" id="f-cost" min="0" step="1" placeholder="0" />
          </div>
          <div class="field">
            <label>Horario (opcional)</label>
            <input type="text" id="f-schedule" placeholder="Ej. 10am–6pm" />
          </div>
        </div>
        <div class="field">
          <label>Zona</label>

}

}

function makeDraggable(cardEl, listEl){
  const handle = cardEl.querySelector('.drag-handle');
  handle.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    cardEl.classList.add('dragging');
    cardEl.setPointerCapture(e.pointerId);
    function onMove(ev){
      const y = ev.clientY;
      const sibs = [...listEl.querySelectorAll('.poi-card')].filter(el => el !== cardEl);
      for (const sib of sibs){
        const r = sib.getBoundingClientRect();
        const mid = r.top + r.height/2;
        if (y < mid && sib.previousElementSibling !== cardEl){ listEl.insertBefore(cardEl, sib); break; }
        if (y >= mid && sib.nextElementSibling !== cardEl){ listEl.insertBefore(cardEl, sib.nextSibling); break; }
      }
    }
    function onUp(){
      cardEl.classList.remove('dragging');
      cardEl.removeEventListener('pointermove', onMove);
      cardEl.removeEventListener('pointerup', onUp);
      persistOrder(listEl);
    }
    cardEl.addEventListener('pointermove', onMove);
    cardEl.addEventListener('pointerup', onUp);
  });
}

async function persistOrder(listEl){
  const ids = [...listEl.querySelectorAll('.poi-card')].map(c=>c.dataset.id);
  const rows = ids.map((id, idx) => ({id, order_index: idx}));
  ids.forEach((id, idx) => { const p = POIS.find(p=>p.id===id); if (p) p.order_index = idx; });
  await sb.from('pois').upsert(rows);
}

/* ---------------- mutations ---------------- */
async function toggleDone(id){
  if (!requireIdentity()) return;
  const p = POIS.find(p=>p.id===id); if (!p) return;
  const next = !p.is_done;
  p.is_done = next; p.updated_by = CURRENT_USER;
  renderDays(); renderMap(); renderBudget();
  await sb.from('pois').update({is_done: next, updated_by: CURRENT_USER}).eq('id', id);
}
async function updateField(id, field, value){
  if (!requireIdentity()) return;
  const p = POIS.find(p=>p.id===id); if (!p) return;
  p[field] = value; p.updated_by = CURRENT_USER;
  if (field === 'transport_cost' || field === 'transport_schedule') renderBudget();
  await sb.from('pois').update({[field]: value, updated_by: CURRENT_USER}).eq('id', id);
}
async function deletePoi(id){
  if (!requireIdentity()) return;
  if (!confirm('¿Eliminar este punto del plan?')) return;
  POIS = POIS.filter(p=>p.id!==id);
  renderDays(); renderMap(); renderBudget();
  await sb.from('pois').delete().eq('id', id);
}

function renderMap(){
  if (!pinLayer) return;
  pinLayer.clearLayers();
  const pts = [];
  for (const p of POIS){
    if (p.lat === null || p.lon === null) continue;
    if (activeDayFilter !== 'all' && p.day !== activeDayFilter) continue;
    const cat = CATEGORY_META[p.category] || CATEGORY_META.landmark;
    if (activeKindFilter !== 'all' && cat.kind !== activeKindFilter) continue;
    const icon = L.divIcon({
      html:`<div class="pin ${p.is_done?'done':''}" style="background:${cat.color}; --glow:${cat.color}88;">${cat.emoji}</div>`,
      className:'', iconSize:[32,32], iconAnchor:[16,16], popupAnchor:[0,-16]
    });
    const marker = L.marker([p.lat, p.lon], {icon}).addTo(pinLayer);
    const costTxt = p.cost !== null && p.cost !== undefined ? (p.cost==0?'Gratis':money(p.cost)) : '';
    marker.bindPopup(`
      <div class="popup-title">${cat.emoji} ${esc(p.name)}</div>
      <div class="popup-meta">${esc(dayLabel(p.day))} · ${costTxt} ${p.schedule?(' · '+esc(p.schedule)):''}</div>
      <button class="popup-done ${p.is_done?'on':''}" data-id="${p.id}">${p.is_done?'✓ Visitado':'Marcar visitado'}</button>
    `);
    marker.on('popupopen', () => {
      document.querySelectorAll('.popup-done').forEach(btn => btn.onclick = () => toggleDone(btn.dataset.id));
    });
    pts.push([p.lat, p.lon]);
  }
  if (activeDayFilter !== 'all' && pts.length) map.fitBounds(pts, {padding:[40,40], maxZoom:15});
}

/* ---------------- budget ---------------- */
function renderBudget(){
  const el = document.getElementById('view-budget');
  const total = POIS.reduce((s,p)=>s + (Number(p.cost)||0), 0);
  const perPerson = total / MEMBERS.length;
  const g = groupByDay(POIS);
  const dayRows = DAY_ORDER.filter(d=>g[d]).map(d => {
    const sum = g[d].reduce((s,p)=>s+(Number(p.cost)||0),0);
    return {day:d, sum};
  });
  const maxDay = Math.max(1, ...dayRows.map(r=>r.sum));
  const tourSum = POIS.filter(p=>(CATEGORY_META[p.category]||{}).kind==='tour').reduce((s,p)=>s+(Number(p.cost)||0),0);
  const foodSum = POIS.filter(p=>(CATEGORY_META[p.category]||{}).kind==='food').reduce((s,p)=>s+(Number(p.cost)||0),0);
  const splitTotal = Math.max(1, tourSum+foodSum);

  el.innerHTML = `
    <div class="budget-hero">
      <div class="budget-tile"><div class="label">Total del viaje</div><div class="value mono-num">${money(total)}</div></div>
      <div class="budget-tile alt"><div class="label">Por persona (÷${MEMBERS.length})</div><div class="value mono-num">${money(perPerson)}</div></div>
    </div>
    <div class="section-title">Por día</div>
    ${dayRows.map(r => `
      <div class="bar-row">
        <div class="bar-label">${dayLabel(r.day)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(r.sum/maxDay*100).toFixed(0)}%; background:linear-gradient(90deg, #29F1E0, #9B5CFF);"></div></div>
        <div class="bar-val mono-num">${money(r.sum)}</div>
      </div>`).join('')}
    <div class="section-title">Turismo vs Comida</div>
    <div class="split-bar">
      <div style="width:${(tourSum/splitTotal*100).toFixed(0)}%; background:#29F1E0;">${tourSum>0?money(tourSum):''}</div>
      <div style="width:${(foodSum/splitTotal*100).toFixed(0)}%; background:#FF7A3D;">${foodSum>0?money(foodSum):''}</div>
    </div>
    <div class="transport-note">🚕 <b>Transporte:</b> aún no tienen esos costos/horarios — el campo está listo en cada punto para llenarlo cuando lo sepan. No se incluye en el total todavía.</div>
  `;
}

function relTime(iso){

  if (s < 60) return 'ahora';
  if (s < 3600) return `hace ${Math.floor(s/60)} min`;
  if (s < 86400) return `hace ${Math.floor(s/3600)} h`;
  return `hace ${Math.floor(s/86400)} d`;
}

/* ---------------- push notifications ---------------- */
function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; }
function isStandalone(){ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
async function subscribePush(){
  if (!requireIdentity()) return;
  if (isIOS() && !isStandalone()){
    document.getElementById('ios-banner').classList.add('show');
    return;
  }
  if (!('serviceWorker' in navigator) || !('PushManager' in window)){
    alert('Este navegador no soporta notificaciones push.');
    return;
  }
  try{
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return;
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const json = sub.toJSON();
    await sb.from('push_subscriptions').upsert({
      endpoint: json.endpoint, member_name: CURRENT_USER, subscription: json
    }, {onConflict:'endpoint'});
    document.getElementById('bell-dot').classList.add('show');
  }catch(err){
    console.error(err);
    alert('No se pudo activar la notificación. Intenta de nuevo.');
  }
}
document.getElementById('btn-bell').addEventListener('click', subscribePush);
document.getElementById('ios-dismiss').addEventListener('click', () => document.getElementById('ios-banner').classList.remove('show'));

/* ---------------- realtime ---------------- */
function subscribeRealtime(){
  sb.channel('pois-rt')
    .on('postgres_changes', {event:'*', schema:'public', table:'pois'}, payload => {
      if (payload.eventType === 'INSERT'){
        if (!POIS.find(p=>p.id===payload.new.id)) POIS.push(payload.new);
      } else if (payload.eventType === 'UPDATE'){
        const idx = POIS.findIndex(p=>p.id===payload.new.id);
        if (idx>=0) POIS[idx] = payload.new;
      } else if (payload.eventType === 'DELETE'){
        POIS = POIS.filter(p=>p.id!==payload.old.id);
      }
      renderDays(); renderMap(); renderBudget();
    })
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'activity_log'}, payload => {
      ACTIVITY.unshift(payload.new);
      renderActivity();
    })
    .subscribe();
}

/* ---------------- init ---------------- */
async function init(){
  renderCountdown();
  setInterval(renderCountdown, 60000);
  renderMemberGrid();
  updateIdentityChip();
  if (!CURRENT_USER) document.getElementById('identity-overlay').classList.remove('hidden');

  initMap();

  const [{data:poisData}, {data:activityData}] = await Promise.all([
    sb.from('pois').select('*').order('order_index'),
    sb.from('activity_log').select('*').order('created_at', {ascending:false}).limit(50),
  ]);
  POIS = poisData || [];
  ACTIVITY = activityData || [];
  renderDays(); renderMap(); renderBudget(); renderActivity();

  subscribeRealtime();

  if ('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistration().then(reg => {
      if (reg) reg.pushManager.getSubscription().then(sub => {
        if (sub) document.getElementById('bell-dot').classList.add('show');
      });
    });
  }
}
init();
</script>
