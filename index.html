<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>NYC 2026 — Viaje Familiar</title>
<meta name="theme-color" content="#FAF7F2" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="NYC Trip" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#F6F2EA; --paper:#FFFFFF; --ink:#171416; --ink-soft:#5B5560;
  --line:#EAE3D6; --line-soft:#F0EBE0;
  --blue:#3B55E8; --violet:#8654F0; --green:#2E9E5B; --yellow:#F0AE2E;
  --coral:#FF5C45; --teal:#0FA99A; --orange:#FF8A3D;
  --taxi:#FFC72C;
  --done:#2E9E5B;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  /* alto real que ocupa la barra flotante: 56px píldora + 14px margen inferior */
  --tabbar-space: calc(84px + var(--safe-b));
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
  min-height:100vh; min-height:100dvh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body.is-dragging{overflow:hidden; touch-action:none;}
body.is-dragging .day-pager{overflow-x:hidden;}
:focus-visible{outline:2.5px solid var(--blue); outline-offset:2px; border-radius:6px;}
h1,h2,h3{font-weight:800; letter-spacing:-.02em;}
.mono-num{font-variant-numeric:tabular-nums;}
a{color:var(--blue);}
button{font-family:inherit;}
::selection{background:var(--yellow); color:var(--ink);}

/* ---------- layout shell ---------- */
#app{display:flex; flex-direction:column; min-height:100vh; min-height:100dvh;}
header.topbar{
  position:sticky; top:0; z-index:40;
  padding:calc(14px + var(--safe-t)) 16px 12px;
  background:var(--bg);
  display:flex; align-items:center; gap:10px;
}
.brand{
  background:none; border:none; padding:0; margin:0; text-align:left; cursor:pointer;
  border-radius:10px; transition:transform .15s ease;
}
.brand:active{transform:scale(.96);}
.logo{
  font-size:19px; font-weight:800; line-height:1.05; color:var(--ink); letter-spacing:-.02em;
}
.logo .dot{color:var(--coral); display:inline-block; transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
.brand:active .logo .dot{transform:translateY(-4px) scale(1.3);}
.trip-sub{font-size:11.5px; color:var(--ink-soft); font-weight:600; margin-top:2px;}
.topbar-spacer{flex:1;}
.icon-btn{
  width:40px;height:40px;border-radius:50%; border:none;
  background:var(--paper); color:var(--ink); display:flex; align-items:center; justify-content:center;
  font-size:17px; cursor:pointer; position:relative;
  box-shadow:0 1px 2px rgba(23,20,22,.06), 0 1px 12px rgba(23,20,22,.05);
}
.icon-btn:active{transform:scale(.93);}
.badge-dot{
  position:absolute; top:2px; right:3px; width:8px;height:8px;border-radius:50%;
  background:var(--coral); border:1.5px solid var(--paper); display:none;
}
.badge-dot.show{display:block;}
.identity-chip{
  display:flex; align-items:center; gap:7px; padding:5px 12px 5px 5px; border-radius:999px;
  background:var(--paper); border:none; cursor:pointer; font-size:13px; font-weight:700; color:var(--ink);
  box-shadow:0 1px 2px rgba(23,20,22,.06), 0 1px 12px rgba(23,20,22,.05);
}
.identity-dot{width:22px;height:22px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-size:11px; font-weight:800; color:#fff;}

main{flex:1; position:relative;}
.view{display:none; animation:viewIn .28s cubic-bezier(.22,.8,.3,1);}
.view.active{display:block;}
@keyframes viewIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

/* ---------- bottom nav ---------- */
nav.tabbar{
  position:fixed; left:14px; right:14px; bottom:calc(14px + var(--safe-b)); z-index:50;
  display:flex; gap:4px; padding:6px;
  background:var(--ink); border-radius:999px;
  box-shadow:0 10px 28px rgba(23,20,22,.28);
}
.tab-btn{
  flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
  background:none; border:none; color:rgba(255,255,255,.55); font-size:13px; font-weight:700;
  padding:11px 8px; border-radius:999px; cursor:pointer;
  transition:background .28s cubic-bezier(.22,.8,.3,1), color .2s ease, flex .28s cubic-bezier(.22,.8,.3,1);
}
.tab-btn .ic{font-size:16px; line-height:1; transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
.tab-btn:active .ic{transform:scale(.85);}
.tab-btn .lbl{display:none;}
.tab-btn.active{color:var(--ink); background:#fff; flex:1.7;}
.tab-btn.active .ic{transform:scale(1.08);}
.tab-btn.active .lbl{display:inline; animation:lblIn .3s ease;}
@keyframes lblIn{from{opacity:0; transform:translateX(-6px);} to{opacity:1; transform:none;}}

/* ---------- identity overlay ---------- */
#identity-overlay{
  position:fixed; inset:0; z-index:200; background:rgba(23,20,22,.45); backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center; padding:24px;
}
#identity-overlay.hidden{display:none;}
.identity-card{
  width:100%; max-width:360px; background:var(--paper); border-radius:28px;
  padding:28px 22px; box-shadow:0 24px 60px rgba(23,20,22,.25);
}
.identity-card h2{margin:0 0 6px; font-size:22px; color:var(--ink);}
.identity-card p{margin:0 0 20px; font-size:13px; color:var(--ink-soft); line-height:1.4;}
.member-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.member-btn{
  display:flex; align-items:center; gap:9px; padding:12px 12px; border-radius:16px;
  background:var(--bg); border:none; color:var(--ink); font-size:14px; cursor:pointer;
  font-family:inherit; font-weight:700;
}
.member-btn:active{transform:scale(.96);}
.member-swatch{width:20px;height:20px;border-radius:50%; flex-shrink:0;}

/* ---------- ios banner ---------- */
#ios-banner{
  display:none; margin:2px 16px 0; padding:13px 14px; border-radius:16px;
  background:#FFF3E0; font-size:12.5px; color:var(--ink); position:relative; line-height:1.4; font-weight:600;
}
#ios-banner.show{display:block;}
#ios-banner button.dismiss{
  position:absolute; top:8px; right:10px; background:none; border:none; color:var(--ink-soft); font-size:15px; cursor:pointer;
}

/* ---------- days view (calendar pager) ---------- */
#view-days{padding:0;}
.day-switcher{
  display:flex; align-items:center; gap:6px; padding:8px 10px 2px;
}
.day-nav-btn{
  width:38px;height:38px;border-radius:50%; border:none; background:var(--paper); color:var(--ink);
  font-size:19px; font-weight:700; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  box-shadow:0 1px 2px rgba(23,20,22,.05);
}
.day-nav-btn:active{transform:scale(.92);}
.day-title{flex:1; text-align:center; font-size:16px; font-weight:800; color:var(--ink);}
.day-title .d-zone{display:block; font-size:11.5px; font-weight:600; color:var(--ink-soft); margin-top:2px;}
.day-strip{
  display:flex; gap:6px; overflow-x:auto; padding:8px 16px 10px; -webkit-overflow-scrolling:touch;
  touch-action:pan-x; scrollbar-width:none;
}
.day-strip::-webkit-scrollbar{display:none;}
.day-pill{
  flex-shrink:0; min-width:42px; padding:7px 10px; border-radius:14px; background:var(--paper); border:none;
  color:var(--ink-soft); font-size:12px; font-weight:800; cursor:pointer; text-align:center;
  transition:background .22s ease, color .22s ease, transform .22s cubic-bezier(.34,1.56,.64,1);
}
.day-pill:active{transform:scale(.9);}
.day-pill.active{background:var(--ink); color:#fff; transform:scale(1.06);}
.day-pager{
  display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
  scrollbar-width:none; width:100%; overscroll-behavior-x:contain;
}
.day-pager::-webkit-scrollbar{display:none;}
.day-page{
  flex:0 0 100%; scroll-snap-align:start; overflow-y:auto; height:100%;
  padding:6px 16px calc(16px + var(--tabbar-space));
  overscroll-behavior-y:contain;
}
.day-page-zone{font-size:12px; font-weight:700; color:var(--ink-soft); margin:2px 2px 12px;}
.poi-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px;}

.poi-card{
  position:relative;
  background:var(--paper);
  border-radius:20px; padding:13px 14px;
  box-shadow:0 1px 2px rgba(23,20,22,.05), 0 2px 16px rgba(23,20,22,.05);
  display:flex; gap:11px; align-items:flex-start;
  transition:box-shadow .2s ease, transform .2s cubic-bezier(.22,.8,.3,1), opacity .2s ease;
  animation:cardIn .38s cubic-bezier(.22,.8,.3,1) backwards;
}
@keyframes cardIn{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;}}
.poi-card.dragging{
  opacity:.92; transform:scale(1.03); z-index:5;
  box-shadow:0 14px 34px rgba(23,20,22,.22); cursor:grabbing;
  transition:none;
}
.drag-handle{
  touch-action:none; color:#D8D2C6; font-size:16px; padding:6px 4px 6px 0; cursor:grab; line-height:1; margin-top:3px;
  transition:color .2s ease; user-select:none; -webkit-user-select:none;
}
.drag-handle:active{cursor:grabbing; color:var(--ink);}
.poi-card.dragging .drag-handle{color:var(--ink);}
.pin-badge{
  width:40px;height:40px;border-radius:13px; flex-shrink:0; display:flex;align-items:center;justify-content:center;
  font-size:18px;
}
.poi-body{flex:1; min-width:0;}
.poi-top{display:flex; justify-content:space-between; align-items:flex-start; gap:6px;}
.poi-name{font-weight:700; font-size:15px; line-height:1.25; color:var(--ink);}
.poi-meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
.chip{
  font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px; background:var(--bg);
  color:var(--ink-soft); white-space:nowrap;
}
.chip.cost{color:var(--green);}
.chip.added{color:var(--violet);}
.poi-note{
  margin-top:8px; font-size:12.5px; color:var(--ink-soft); background:var(--bg); border:none; border-radius:10px;
  width:100%; padding:7px 10px; font-family:inherit; resize:none;
}
.poi-note:focus{outline:2px solid var(--blue); outline-offset:1px;}
.transport-row{margin-top:7px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
.transport-row input{
  background:var(--bg); border:none; border-radius:9px; color:var(--ink);
  font-size:11.5px; padding:6px 8px; font-family:inherit; width:96px; font-weight:600;
}
.transport-row input:focus{outline:2px solid var(--blue);}
.transport-label{font-size:10.5px; color:var(--ink-soft); font-weight:700;}
.poi-actions{display:flex; flex-direction:column; gap:6px; align-items:center;}
.done-btn{
  width:32px;height:32px;border-radius:50%; border:none; background:var(--bg);
  color:#C9C2B4; font-size:15px; cursor:pointer; display:flex;align-items:center;justify-content:center; font-weight:800;
  transition:background .22s ease, color .22s ease, transform .24s cubic-bezier(.34,1.56,.64,1);
}
.done-btn:active{transform:scale(.85);}
.done-btn.on{background:var(--done); color:#fff; animation:pop .34s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{0%{transform:scale(1);} 45%{transform:scale(1.28);} 100%{transform:scale(1);}}
.del-btn{background:none; border:none; color:#D8D2C6; font-size:13px; cursor:pointer; transition:color .2s ease, transform .15s ease;}
.del-btn:hover{color:var(--coral);}
.del-btn:active{transform:scale(.85);}

.poi-card.is-done{opacity:.6;}
.poi-card.is-done .poi-name{text-decoration:line-through; text-decoration-color:var(--done);}
.done-pill{
  display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:800; letter-spacing:.02em;
  color:#fff; background:var(--done); border-radius:999px; padding:3px 9px; margin-left:8px;
  animation:pop .34s cubic-bezier(.34,1.56,.64,1);
}

/* ---------- map view ---------- */
#view-map{padding:0;}
#leaflet-map{
  width:100%; height:calc(100dvh - 260px); min-height:240px; background:#F3F1EC;
  border-radius:22px 22px 0 0; overflow:hidden;
}
.filter-bar{
  display:flex; gap:7px; overflow-x:auto; padding:10px 16px; -webkit-overflow-scrolling:touch;
  background:var(--bg); touch-action:pan-x;
}
.filter-bar::-webkit-scrollbar{display:none;}
.filter-chip{
  flex-shrink:0; padding:7px 14px; border-radius:999px; background:var(--paper); border:none;
  color:var(--ink-soft); font-size:12px; white-space:nowrap; cursor:pointer; font-weight:700;
  box-shadow:0 1px 2px rgba(23,20,22,.05);
  transition:background .2s ease, color .2s ease, transform .15s ease;
}
.filter-chip:active{transform:scale(.94);}
.filter-chip.active{background:var(--ink); color:#fff;}
.pin{
  width:30px;height:30px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-size:14px;
  border:2.5px solid #fff; box-shadow:0 2px 8px rgba(23,20,22,.28);
  animation:pinDrop .34s cubic-bezier(.34,1.56,.64,1) backwards;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1);
}
.pin:hover{transform:scale(1.18);}
@keyframes pinDrop{from{opacity:0; transform:translateY(-12px) scale(.5);} to{opacity:1; transform:none;}}
.pin.done{opacity:.4;}
.leaflet-popup-content-wrapper{background:var(--paper); color:var(--ink); border-radius:16px; box-shadow:0 12px 30px rgba(23,20,22,.2);}
.leaflet-popup-tip{background:var(--paper);}
.leaflet-popup-content{margin:13px 15px; font-family:'Plus Jakarta Sans';}
.popup-title{font-weight:800; font-size:14.5px; margin-bottom:4px;}
.popup-meta{font-size:11.5px; color:var(--ink-soft); margin-bottom:9px; font-weight:600;}
.popup-done{
  font-size:11.5px; padding:6px 12px; border-radius:999px; border:none; color:#fff; background:var(--ink); cursor:pointer; font-weight:800;
}
.popup-done.on{background:var(--done);}

/* ---------- budget view ---------- */
#view-budget{padding:10px 16px calc(24px + var(--tabbar-space));}
.budget-hero{
  display:flex; gap:10px; margin-bottom:18px;
}
.budget-tile{
  flex:1; background:var(--ink); border-radius:20px;
  padding:16px; text-align:left;
  animation:tileIn .4s cubic-bezier(.22,.8,.3,1) backwards;
}
.budget-tile:nth-child(2){animation-delay:.07s;}
@keyframes tileIn{from{opacity:0; transform:translateY(14px) scale(.96);} to{opacity:1; transform:none;}}
.budget-tile.alt{background:var(--teal);}
.budget-tile .label{font-size:11px; color:rgba(255,255,255,.65); font-weight:700;}
.budget-tile .value{font-size:26px; margin-top:6px; color:#fff; font-weight:800; letter-spacing:-.02em;}
.section-title{font-size:13px; font-weight:800; color:var(--ink); margin:22px 2px 12px;}
.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.bar-label{width:82px; font-size:12px; color:var(--ink-soft); flex-shrink:0; font-weight:600;}
.bar-track{flex:1; height:12px; background:var(--paper); border-radius:8px; overflow:hidden;}
.bar-fill{height:100%; border-radius:8px; background:var(--blue); animation:barGrow .6s cubic-bezier(.22,.8,.3,1) backwards;}
@keyframes barGrow{from{width:0;}}
.bar-val{width:48px; text-align:right; font-size:12px; color:var(--ink); flex-shrink:0; font-weight:700;}
.split-bar{display:flex; height:26px; border-radius:12px; overflow:hidden; margin-bottom:6px;}
.split-bar div{display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#fff;}
.transport-note{
  margin-top:20px; padding:14px 16px; border-radius:18px; background:#FFF3E0;
  font-size:12.5px; color:var(--ink); line-height:1.5; font-weight:600;
}

/* ---------- fab + modal ---------- */
.fab{
  position:fixed; right:16px; bottom:calc(var(--tabbar-space) + 10px); z-index:45;
  width:54px;height:54px;border-radius:50%; border:none;
  background:var(--ink); color:#fff; font-size:24px; display:flex;align-items:center;justify-content:center; cursor:pointer;
  box-shadow:0 10px 24px rgba(23,20,22,.3); font-weight:700;
  transition:transform .24s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease;
}
.fab:hover{transform:translateY(-2px); box-shadow:0 14px 30px rgba(23,20,22,.36);}
.fab:active{transform:scale(.9) rotate(90deg);}
.sheet-overlay{
  position:fixed; inset:0; z-index:150; background:rgba(23,20,22,.45); backdrop-filter:blur(3px);
  display:flex; align-items:flex-end; justify-content:center;
  animation:overlayIn .22s ease;
}
@keyframes overlayIn{from{opacity:0;} to{opacity:1;}}
.sheet-overlay.hidden{display:none;}
.sheet{
  width:100%; max-width:480px; max-height:88vh; overflow-y:auto; background:var(--bg);
  border-radius:26px 26px 0 0;
  padding:20px 18px calc(24px + var(--safe-b));
  animation:sheetUp .34s cubic-bezier(.22,.9,.3,1);
}
@keyframes sheetUp{from{transform:translateY(100%);} to{transform:none;}}
.sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.sheet h3{margin:0; font-size:18px; color:var(--ink);}
.sheet-close{
  width:32px;height:32px;border-radius:50%; border:none; background:var(--paper); color:var(--ink-soft);
  font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.sheet-close:active{transform:scale(.92);}
.field{margin-bottom:12px;}
.field label{display:block; font-size:11.5px; color:var(--ink-soft); font-weight:700; margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%; background:var(--paper); border:none; border-radius:14px; color:var(--ink);
  padding:12px 13px; font-size:14px; font-family:inherit; font-weight:600;
}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--blue);}
.field textarea{resize:vertical; min-height:56px;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
#mini-map{height:160px; border-radius:16px; margin-top:6px;}
.mini-map-hint{font-size:11px; color:var(--ink-soft); margin-top:6px; font-weight:600;}
.btn-primary{
  width:100%; padding:15px; border-radius:16px; border:none; margin-top:8px;
  background:var(--ink); color:#fff; font-weight:800; font-size:14.5px;
  letter-spacing:-.01em; cursor:pointer;
}
.btn-ghost{
  width:100%; padding:12px; border-radius:16px; margin-top:8px; background:none; border:none;
  color:var(--ink-soft); font-size:13px; font-weight:700; cursor:pointer;
}

/* ---------- activity panel ---------- */
#activity-panel{
  position:fixed; top:0; right:0; bottom:0; width:min(340px,86vw); z-index:180;
  background:var(--paper); transform:translateX(100%);
  transition:transform .25s ease; padding:calc(18px + var(--safe-t)) 18px 18px; overflow-y:auto;
}
#activity-panel.open{transform:translateX(0);}
#activity-panel h3{color:var(--ink); font-size:17px; margin:0 0 16px;}
.activity-item{padding:11px 0; border-bottom:1px solid var(--line); font-size:13px; color:var(--ink-soft); line-height:1.4;}
.activity-item b{color:var(--ink);}
.activity-time{font-size:11px; color:#B9B2A4; margin-top:3px; font-weight:600;}
#activity-scrim{position:fixed; inset:0; z-index:170; background:rgba(23,20,22,.4); display:none;}
#activity-scrim.show{display:block;}

::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

/* ---------- micro-interacciones ---------- */
.icon-btn, .identity-chip, .day-nav-btn, .member-btn, .btn-primary, .btn-ghost, .sheet-close, .popup-done{
  transition:transform .16s cubic-bezier(.34,1.56,.64,1), background .2s ease, box-shadow .2s ease, opacity .2s ease;
}
.btn-primary:active{transform:scale(.97);}
.btn-ghost:active{transform:scale(.97);}
.identity-card{animation:cardPop .34s cubic-bezier(.34,1.56,.64,1);}
@keyframes cardPop{from{opacity:0; transform:scale(.92) translateY(14px);} to{opacity:1; transform:none;}}
#identity-overlay:not(.hidden){animation:overlayIn .22s ease;}
.member-btn{animation:cardIn .3s cubic-bezier(.22,.8,.3,1) backwards;}
.member-btn:nth-child(1){animation-delay:.02s;} .member-btn:nth-child(2){animation-delay:.04s;}
.member-btn:nth-child(3){animation-delay:.06s;} .member-btn:nth-child(4){animation-delay:.08s;}

let daysCache = [];
let currentDayKey = null;

function renderDays(){
  // No re-dibujar mientras alguien arrastra: destruiría la tarjeta en movimiento.
  if (isDragging){ renderQueued = true; return; }
  const g = groupByDay(POIS);
  const days = DAY_ORDER.filter(d => g[d] && g[d].length);

  if (!days.length) return;
  if (!currentDayKey || !days.includes(currentDayKey)) currentDayKey = days[0];

  pager.innerHTML = days.map(day => {

    </div>`;
  }).join('');

  const newPage = pager.querySelector(`.day-page[data-day="${currentDayKey}"]`);
  if (newPage && prevScroll) newPage.scrollTop = prevScroll;

  pager.querySelectorAll('.done-btn').forEach(b=>b.addEventListener('click', ()=>toggleDone(b.dataset.id)));
  pager.querySelectorAll('.del-btn').forEach(b=>b.addEventListener('click', ()=>deletePoi(b.dataset.id)));

  pager.querySelectorAll('.t-sched').forEach(i=>i.addEventListener('change', ()=>updateField(i.dataset.id, 'transport_schedule', i.value||null)));
  pager.querySelectorAll('.poi-list').forEach(list => {
    list.querySelectorAll('.poi-card').forEach(card => makeDraggable(card, list));
  });

  updateDayTitle();
  sizeDayPager();

function makeDraggable(cardEl, listEl){
  const handle = cardEl.querySelector('.drag-handle');

  handle.addEventListener('pointerdown', (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();

    const scroller = listEl.closest('.day-page');
    let pointerY = e.clientY;
    let moved = false;
    let raf = null;

    // Ojo: NO usamos setPointerCapture. Al reordenar movemos la tarjeta en el DOM,
    // y eso libera la captura (el handle vive dentro de la tarjeta), cortando el arrastre.
    // Escuchar en document es inmune a que el nodo cambie de lugar.
    isDragging = true;
    cardEl.classList.add('dragging');
    document.body.classList.add('is-dragging');
    if (navigator.vibrate) navigator.vibrate(8);

    // Reordena comparando contra el punto medio de cada hermano.
    // Si ninguno queda por debajo del cursor, la tarjeta va al final.
    function reorder(){
      const others = [...listEl.querySelectorAll('.poi-card')].filter(el => el !== cardEl);
      const before = others.find(el => {
        const r = el.getBoundingClientRect();
        return pointerY < r.top + r.height / 2;
      });
      if (before){
        if (before.previousElementSibling !== cardEl) listEl.insertBefore(cardEl, before);
      } else if (listEl.lastElementChild !== cardEl){
        listEl.appendChild(cardEl);
      }
    }

    // Auto-scroll cuando arrastras cerca del borde de la lista.
    function tick(){
      if (scroller){
        const r = scroller.getBoundingClientRect();
        const EDGE = 76;
        if (pointerY < r.top + EDGE) scroller.scrollTop -= 10;
        else if (pointerY > r.bottom - EDGE) scroller.scrollTop += 10;
      }
      reorder();
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);

    function onMove(ev){
      ev.preventDefault();
      pointerY = ev.clientY;
      moved = true;
    }
    function onEnd(){
      cancelAnimationFrame(raf);
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onEnd);
      document.removeEventListener('pointercancel', onEnd);
      cardEl.classList.remove('dragging');
      document.body.classList.remove('is-dragging');
      isDragging = false;
      if (moved) persistOrder(listEl);
      if (renderQueued){ renderQueued = false; renderDays(); }
    }
    document.addEventListener('pointermove', onMove, {passive:false});
    document.addEventListener('pointerup', onEnd);
    document.addEventListener('pointercancel', onEnd);
  });
}

async function persistOrder(listEl){
  const ids = [...listEl.querySelectorAll('.poi-card')].map(c=>c.dataset.id);
  ids.forEach((id, idx) => { const p = POIS.find(p=>p.id===id); if (p) p.order_index = idx; });
  // update por fila, no upsert: un upsert parcial choca contra las columnas NOT NULL
  // (day, zone, category, name) y falla en silencio, perdiendo el nuevo orden.
  const results = await Promise.all(
    ids.map((id, idx) => sb.from('pois').update({order_index: idx}).eq('id', id))
  );
  const failed = results.find(r => r.error);
  if (failed) console.error('No se pudo guardar el orden:', failed.error);
}

  renderDays(); renderMap(); renderBudget();
  await sb.from('pois').update({is_done: next, updated_by: CURRENT_USER}).eq('id', id);
}
async function updateField(id, field, value){
  if (!requireIdentity()) return;
  const p = POIS.find(p=>p.id===id); if (!p) return;
  p[field] = value; p.updated_by = CURRENT_USER;
  if (field === 'transport_cost' || field === 'transport_schedule') renderBudget();
  await sb.from('pois').update({[field]: value, updated_by: CURRENT_USER}).eq('id', id);
}
async function deletePoi(id){
  if (!requireIdentity()) return;
  if (!confirm('¿Eliminar este punto del plan?')) return;
  POIS = POIS.filter(p=>p.id!==id);
  renderDays(); renderMap(); renderBudget();
  await sb.from('pois').delete().eq('id', id);
}

/* ---------------- map ---------------- */
// El alto que ocupa la barra flotante, para que el mapa no quede debajo de ella.
function tabbarSpace(){
  const bar = document.querySelector('nav.tabbar');
  if (!bar) return 84;
  return window.innerHeight - bar.getBoundingClientRect().top + 10;
}

function sizeMap(){
  const mapDiv = document.getElementById('leaflet-map');
  if (!mapDiv) return;
  const top = mapDiv.getBoundingClientRect().top;
  mapDiv.style.height = Math.max(240, window.innerHeight - top - tabbarSpace()) + 'px';
  if (map) map.invalidateSize();
}
window.addEventListener('resize', sizeMap);

function initMap(){
  map = L.map('leaflet-map', {zoomControl:true}).setView([40.735,-73.99], 12.3);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    maxZoom:19, attribution:'© OpenStreetMap © CARTO', subdomains:'abcd'
  }).addTo(map);
  pinLayer = L.layerGroup().addTo(map);

  const dayFilterBar = document.getElementById('filter-days');
  dayFilterBar.innerHTML = `<button class="filter-chip active" data-day="all">Todos</button>` +
    DAY_ORDER.filter(d=>d!=='2026-09-23').map(d=>`<button class="filter-chip" data-day="${d}">${dayLabel(d)}</button>`).join('');
  dayFilterBar.querySelectorAll('.filter-chip').forEach(b=>b.addEventListener('click', ()=>{
    dayFilterBar.querySelectorAll('.filter-chip').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); activeDayFilter = b.dataset.day; renderMap();
  }));
  document.getElementById('filter-kind').querySelectorAll('.filter-chip').forEach(b=>b.addEventListener('click', ()=>{
    document.querySelectorAll('#filter-kind .filter-chip').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); activeKindFilter = b.dataset.kind; renderMap();
  }));
}

function renderMap(){
  if (!pinLayer) return;
  pinLayer.clearLayers();
  const pts = [];
  for (const p of POIS){
    if (p.lat === null || p.lon === null) continue;
    if (activeDayFilter !== 'all' && p.day !== activeDayFilter) continue;
    const cat = CATEGORY_META[p.category] || CATEGORY_META.landmark;
    if (activeKindFilter !== 'all' && cat.kind !== activeKindFilter) continue;
    const icon = L.divIcon({
      html:`<div class="pin ${p.is_done?'done':''}" style="background:${cat.color};">${cat.emoji}</div>`,
      className:'', iconSize:[30,30], iconAnchor:[15,15], popupAnchor:[0,-15]
    });
    const marker = L.marker([p.lat, p.lon], {icon}).addTo(pinLayer);
    const costTxt = p.cost !== null && p.cost !== undefined ? (p.cost==0?'Gratis':money(p.cost)) : '';
    marker.bindPopup(`
      <div class="popup-title">${cat.emoji} ${esc(p.name)}</div>
      <div class="popup-meta">${esc(dayLabel(p.day))} · ${costTxt} ${p.schedule?(' · '+esc(p.schedule)):''}</div>
      <button class="popup-done ${p.is_done?'on':''}" data-id="${p.id}">${p.is_done?'✓ Visitado':'Marcar visitado'}</button>
    `);
    marker.on('popupopen', () => {
      document.querySelectorAll('.popup-done').forEach(btn => btn.onclick = () => toggleDone(btn.dataset.id));
    });
    pts.push([p.lat, p.lon]);
  }
  if (activeDayFilter !== 'all' && pts.length) map.fitBounds(pts, {padding:[40,40], maxZoom:15});
}

/* ---------------- budget ---------------- */
function renderBudget(){
  const el = document.getElementById('view-budget');
  // Los costos del itinerario están capturados por persona (así venían en el sheet original).
  const perPerson = POIS.reduce((s,p)=>s + (Number(p.cost)||0), 0);
  const total = perPerson * MEMBERS.length;
  const g = groupByDay(POIS);
  const dayRows = DAY_ORDER.filter(d=>g[d]).map(d => {
    const sum = g[d].reduce((s,p)=>s+(Number(p.cost)||0),0);
    return {day:d, sum};
  });
  const maxDay = Math.max(1, ...dayRows.map(r=>r.sum));
  const tourSum = POIS.filter(p=>(CATEGORY_META[p.category]||{}).kind==='tour').reduce((s,p)=>s+(Number(p.cost)||0),0);
  const foodSum = POIS.filter(p=>(CATEGORY_META[p.category]||{}).kind==='food').reduce((s,p)=>s+(Number(p.cost)||0),0);
  const splitTotal = Math.max(1, tourSum+foodSum);

  el.innerHTML = `
    <div class="budget-hero">
      <div class="budget-tile"><div class="label">Total del viaje (×${MEMBERS.length})</div><div class="value mono-num">${money(total)}</div></div>
      <div class="budget-tile alt"><div class="label">Por persona</div><div class="value mono-num">${money(perPerson)}</div></div>
    </div>
    <div class="section-title">Por día · por persona</div>
    ${dayRows.map(r => `
      <div class="bar-row">
        <div class="bar-label">${dayLabel(r.day)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(r.sum/maxDay*100).toFixed(0)}%;"></div></div>
        <div class="bar-val mono-num">${money(r.sum)}</div>
      </div>`).join('')}
    <div class="section-title">Turismo vs Comida · por persona</div>
    <div class="split-bar">
      <div style="width:${(tourSum/splitTotal*100).toFixed(0)}%; background:var(--blue);">${tourSum>0?money(tourSum):''}</div>
      <div style="width:${(foodSum/splitTotal*100).toFixed(0)}%; background:var(--orange);">${foodSum>0?money(foodSum):''}</div>
    </div>
    <div class="transport-note">🚕 <b>Transporte:</b> aún no tienen esos costos/horarios — el campo está listo en cada punto para llenarlo cuando lo sepan. No se incluye en el total todavía.</div>
  `;
}

/* ---------------- add modal ---------------- */
function openAddModal(){
  if (!requireIdentity()) return;
  const daySel = document.getElementById('f-day');
  daySel.innerHTML = DAY_ORDER.map(d=>`<option value="${d}">${dayLabel(d)}</option>`).join('');
  const zones = [...new Set(POIS.map(p=>p.zone).filter(z=>z && z!=='—'))];
  document.getElementById('zone-list').innerHTML = zones.map(z=>`<option value="${esc(z)}">`).join('');
  document.getElementById('add-form').reset();
  if (currentDayKey) daySel.value = currentDayKey;
  miniMarker = null;
  document.getElementById('mini-map-hint').textContent = 'Toca el mapa para marcar el lugar.';
  document.getElementById('add-overlay').classList.remove('hidden');
  setTimeout(() => {
    if (!miniMap){
      miniMap = L.map('mini-map', {zoomControl:false}).setView([40.735,-73.99], 11.5);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19}).addTo(miniMap);
      miniMap.on('click', (e) => {
        if (miniMarker) miniMap.removeLayer(miniMarker);
        miniMarker = L.marker(e.latlng).addTo(miniMap);
        document.getElementById('mini-map-hint').textContent = `📍 ${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`;
      });
    }
    miniMap.invalidateSize();
  }, 60);
}
document.getElementById('btn-fab').addEventListener('click', openAddModal);
document.getElementById('btn-cancel-add').addEventListener('click', () => document.getElementById('add-overlay').classList.add('hidden'));
document.getElementById('btn-close-add').addEventListener('click', () => document.getElementById('add-overlay').classList.add('hidden'));

document.getElementById('add-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!requireIdentity()) return;
  const day = document.getElementById('f-day').value;
  const category = document.getElementById('f-category').value;
  const name = document.getElementById('f-name').value.trim();
  const costRaw = document.getElementById('f-cost').value;
  const schedule = document.getElementById('f-schedule').value.trim() || null;
  const zone = document.getElementById('f-zone').value.trim() || '—';
  const notes = document.getElementById('f-notes').value.trim() || null;
  if (!name) return;
  const dayItems = POIS.filter(p=>p.day===day);
  const orderIndex = dayItems.length ? Math.max(...dayItems.map(p=>p.order_index)) + 1 : 0;
  const row = {
    day, zone, category, name,
    cost: costRaw === '' ? null : Number(costRaw),
    schedule, notes,
    lat: miniMarker ? miniMarker.getLatLng().lat : null,
    lon: miniMarker ? miniMarker.getLatLng().lng : null,
    added_by: CURRENT_USER, updated_by: CURRENT_USER,
    order_index: orderIndex,
  };
  document.getElementById('add-overlay').classList.add('hidden');
  const {data, error} = await sb.from('pois').insert(row).select().single();
  if (!error && data){
    POIS.push(data);
    renderDays(); renderMap(); renderBudget();
  }
});

/* ---------------- activity panel ---------------- */
function relTime(iso){
  const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
  if (s < 60) return 'ahora';
  if (s < 3600) return `hace ${Math.floor(s/60)} min`;
  if (s < 86400) return `hace ${Math.floor(s/3600)} h`;
  return `hace ${Math.floor(s/86400)} d`;
}
const ACTION_TXT = {add:'agregó', done:'marcó como visitado a', transport:'actualizó el transporte de'};
function renderActivity(){
  const el = document.getElementById('activity-list');
  if (!ACTIVITY.length){ el.innerHTML = `<div class="activity-item">Aún no hay actividad.</div>`; return; }
  el.innerHTML = ACTIVITY.slice(0,40).map(a => `
    <div class="activity-item"><b>${esc(a.member_name||'Alguien')}</b> ${ACTION_TXT[a.action]||a.action} "${esc(a.poi_name)}"
    <div class="activity-time">${relTime(a.created_at)}</div></div>
  `).join('');
}
document.getElementById('btn-activity').addEventListener('click', () => {
  document.getElementById('activity-panel').classList.add('open');
  document.getElementById('activity-scrim').classList.add('show');
});
document.getElementById('activity-scrim').addEventListener('click', () => {
  document.getElementById('activity-panel').classList.remove('open');
  document.getElementById('activity-scrim').classList.remove('show');
});

/* ---------------- push notifications ---------------- */
function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; }
function isStandalone(){ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
async function subscribePush(){
  if (!requireIdentity()) return;
  if (isIOS() && !isStandalone()){
    document.getElementById('ios-banner').classList.add('show');
    return;
  }
  if (!('serviceWorker' in navigator) || !('PushManager' in window)){
    alert('Este navegador no soporta notificaciones push.');
    return;
  }
  try{
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return;
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const json = sub.toJSON();
    await sb.from('push_subscriptions').upsert({
      endpoint: json.endpoint, member_name: CURRENT_USER, subscription: json
    }, {onConflict:'endpoint'});
    document.getElementById('bell-dot').classList.add('show');
  }catch(err){
    console.error(err);
    alert('No se pudo activar la notificación. Intenta de nuevo.');
  }
}
document.getElementById('btn-bell').addEventListener('click', subscribePush);
document.getElementById('ios-dismiss').addEventListener('click', () => document.getElementById('ios-banner').classList.remove('show'));

/* ---------------- realtime ---------------- */
function subscribeRealtime(){
  sb.channel('pois-rt')
    .on('postgres_changes', {event:'*', schema:'public', table:'pois'}, payload => {
      if (payload.eventType === 'INSERT'){
        if (!POIS.find(p=>p.id===payload.new.id)) POIS.push(payload.new);
      } else if (payload.eventType === 'UPDATE'){
        const idx = POIS.findIndex(p=>p.id===payload.new.id);
        if (idx>=0) POIS[idx] = payload.new;
      } else if (payload.eventType === 'DELETE'){
        POIS = POIS.filter(p=>p.id!==payload.old.id);
      }
      renderDays(); renderMap(); renderBudget();
    })
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'activity_log'}, payload => {
      ACTIVITY.unshift(payload.new);
      renderActivity();
    })
    .subscribe();
}

/* ---------------- init ---------------- */
async function init(){
  renderCountdown();
  setInterval(renderCountdown, 60000);
  renderMemberGrid();
  updateIdentityChip();
  if (!CURRENT_USER) document.getElementById('identity-overlay').classList.remove('hidden');

  initMap();

  const [{data:poisData}, {data:activityData}] = await Promise.all([
    sb.from('pois').select('*').order('order_index'),
    sb.from('activity_log').select('*').order('created_at', {ascending:false}).limit(50),
  ]);
  POIS = poisData || [];
  ACTIVITY = activityData || [];
  renderDays(); renderMap(); renderBudget(); renderActivity();

  subscribeRealtime();

  if ('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistration().then(reg => {
      if (reg) reg.pushManager.getSubscription().then(sub => {
        if (sub) document.getElementById('bell-dot').classList.add('show');
      });
    });
  }
}
init();
</script>
